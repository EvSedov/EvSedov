    <rect width="1180" height="610" fill="url(#glowBlue)"/>
    <rect width="1180" height="610" fill="url(#glowCyan)"/>
    <rect width="1180" height="610" fill="url(#glowEmerald)"/>
    <rect width="1180" height="610" filter="url(#noise)" opacity=".55"/>

    <g opacity=".48">
      <circle cx="86" cy="122" r="1.4" fill="#2563EB"><animate attributeName="cy" values="122;107;122" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="1020" cy="104" r="1.7" fill="#06B6D4"><animate attributeName="cy" values="104;122;104" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="486" r="1.3" fill="#10B981"><animate attributeName="cx" values="950;970;950" dur="11s" repeatCount="indefinite"/></circle>
      <circle cx="334" cy="520" r="1.2" fill="#2563EB"><animate attributeName="cy" values="520;502;520" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="462" cy="86" r="1.1" fill="#06B6D4"><animate attributeName="opacity" values=".16;.55;.16" dur="6s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="13" y="13" width="1154" height="584" rx="30" fill="none" stroke="url(#borderGradient)" stroke-width="1.4"/>
    <rect x="30" y="30" width="1120" height="550" rx="28" fill="#F8FAFC" opacity=".66" stroke="rgba(15,23,42,.08)" filter="url(#softShadow)"/>

    <g transform="translate(66 78)">
      <animateTransform attributeName="transform" type="translate" values="66 78;66 68;66 78" dur="7s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="382" height="456" rx="28" fill="#F8FAFC" opacity=".78" stroke="rgba(15,23,42,.08)" filter="url(#panelGlow)"/>
      <path d="M35 36 C85 6, 156 18, 205 54 C251 88, 297 78, 338 55" fill="none" stroke="#0F172A" stroke-opacity=".06" stroke-width="1.1"/>
      <rect x="24" y="58" width="334" height="328" rx="18" fill="#FFFFFF" opacity=".64" stroke="#06B6D4" stroke-opacity=".13"/>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="600" fill="url(#asciiGradient)" filter="url(#asciiGlow)" opacity=".94">
        <text x="57" y="107">        .-""""-.</text>
        <text x="57" y="132" opacity=".28">     .'/  _  _  \`.<animate attributeName="opacity" values=".28;1" begin=".35s" dur=".5s" fill="freeze"/></text>
        <text x="57" y="157" opacity=".28">    /   (o)(o)   \<animate attributeName="opacity" values=".28;1" begin=".7s" dur=".5s" fill="freeze"/></text>
        <text x="57" y="182" opacity=".28">   |      __      |<animate attributeName="opacity" values=".28;1" begin="1.05s" dur=".5s" fill="freeze"/></text>
        <text x="57" y="207" opacity=".28">   |   .-'__'-.   |<animate attributeName="opacity" values=".28;1" begin="1.4s" dur=".5s" fill="freeze"/></text>
        <text x="57" y="232" opacity=".28">    \  \____/  /<animate attributeName="opacity" values=".28;1" begin="1.75s" dur=".5s" fill="freeze"/></text>
        <text x="57" y="257" opacity=".28">     '.        .'<animate attributeName="opacity" values=".28;1" begin="2.1s" dur=".5s" fill="freeze"/></text>
        <text x="57" y="282" opacity=".28">       /`-..-'\<animate attributeName="opacity" values=".28;1" begin="2.45s" dur=".5s" fill="freeze"/></text>
        <text x="57" y="307" opacity=".28">   ___/  |  |  \___<animate attributeName="opacity" values=".28;1" begin="2.8s" dur=".5s" fill="freeze"/></text>
        <text x="57" y="332" opacity=".28">  /_____/|__|\_____\<animate attributeName="opacity" values=".28;1" begin="3.15s" dur=".5s" fill="freeze"/></text>
      </g>

      <rect x="42" y="80" width="298" height="34" fill="#06B6D4" opacity=".06">
        <animate attributeName="y" values="80;352;80" dur="4.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".01;.09;.01" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="60" y="348" width="10" height="20" rx="2" fill="#2563EB">
