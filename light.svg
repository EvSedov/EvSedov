        Frontend Engineer
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.50;.58;.70;.74;1" dur="13s" repeatCount="indefinite"/>
      </text>
      <text clip-path="url(#roleClip4)" x="604" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="23" fill="url(#accentGradient)" opacity="0">
        Personal AI Systems Explorer
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.75;.83;.95;1" dur="13s" repeatCount="indefinite"/>
      </text>
      <rect x="574" y="238" width="12" height="26" rx="2" fill="#2563EB">
        <animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/>
      </rect>

      <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#475569">
        <text x="574" y="306" opacity=".28">📍 Location<tspan fill="#0F172A" dx="22">Novosibirsk, Russia / Remote</tspan><animate attributeName="opacity" values=".28;1" begin="1.3s" dur=".55s" fill="freeze"/></text>
        <text x="574" y="334" opacity=".28">🎓 Education<tspan fill="#0F172A" dx="18">Self-directed engineering path</tspan><animate attributeName="opacity" values=".28;1" begin="1.65s" dur=".55s" fill="freeze"/></text>
        <text x="574" y="362" opacity=".28">🎯 Focus<tspan fill="#0F172A" dx="47">Frontend architecture · AI agents · PAI</tspan><animate attributeName="opacity" values=".28;1" begin="2s" dur=".55s" fill="freeze"/></text>
        <text x="574" y="390" opacity=".28">✉ Email<tspan fill="#0F172A" dx="51">sedoff-online@yandex.ru</tspan><animate attributeName="opacity" values=".28;1" begin="2.35s" dur=".55s" fill="freeze"/></text>
        <text x="574" y="418" opacity=".28">RU<tspan fill="#0F172A" dx="78">Интерфейсы · AI-агенты · PAI</tspan><animate attributeName="opacity" values=".28;1" begin="2.7s" dur=".55s" fill="freeze"/></text>
