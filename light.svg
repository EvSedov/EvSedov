<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">Evgeniy Sedov — GitHub Profile Hero Banner</title>
  <desc id="desc">Animated premium light GitHub profile banner for Evgeniy Sedov, Vue TypeScript developer and AI infrastructure builder.</desc>

  <defs>
    <linearGradient id="borderGradient" x1="0" y1="0" x2="1180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".22"/>
      <stop offset="45%" stop-color="#06B6D4" stop-opacity=".62"/>
      <stop offset="78%" stop-color="#10B981" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity=".22"/>
      <animate attributeName="x1" values="-1180;0;1180" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1180;2360" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="asciiGradient" x1="0" y1="0" x2="430" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="48%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 215 215" to="360 215 215" dur="18s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="575" y1="0" x2="1045" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="52%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
      <animate attributeName="x1" values="520;650;520" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="980;1110;980" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx="22%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="78%" cy="25%" r="58%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="63%" cy="88%" r="52%">
      <stop offset="0%" stop-color="#10B981" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#0F172A" flood-opacity=".12"/>
    </filter>

    <filter id="asciiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation=".8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="panelGlow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#06B6D4" flood-opacity=".10"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#2563EB" flood-opacity=".07"/>
    </filter>

    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .026"/>
      </feComponentTransfer>
    </filter>

    <clipPath id="outerClip">
      <rect x="0" y="0" width="1180" height="610" rx="34" ry="34"/>
    </clipPath>

    <clipPath id="terminalClip">
      <rect x="520" y="70" width="590" height="470" rx="24" ry="24"/>
    </clipPath>

    <clipPath id="roleClip1"><rect x="604" y="230" width="0" height="34"><animate attributeName="width" values="0;238;238;0;0" keyTimes="0;.08;.20;.24;1" dur="13s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="roleClip2"><rect x="604" y="230" width="0" height="34"><animate attributeName="width" values="0;0;248;248;0;0" keyTimes="0;.25;.33;.45;.49;1" dur="13s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="roleClip3"><rect x="604" y="230" width="0" height="34"><animate attributeName="width" values="0;0;178;178;0;0" keyTimes="0;.50;.58;.70;.74;1" dur="13s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="roleClip4"><rect x="604" y="230" width="0" height="34"><animate attributeName="width" values="0;0;286;286;0" keyTimes="0;.75;.83;.95;1" dur="13s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <g clip-path="url(#outerClip)">
