      <text x="574" y="198" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="46" fill="#0F172A" font-weight="800" letter-spacing="-.035em">I'm Evgeniy Sedov</text>
      <rect x="574" y="216" width="318" height="2" rx="1" fill="url(#accentGradient)">
