        Vue / TypeScript Developer
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.08;.20;.24;1" dur="13s" repeatCount="indefinite"/>
      </text>
      <text clip-path="url(#roleClip2)" x="604" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="23" fill="url(#accentGradient)" opacity="0">
        AI Infrastructure Builder
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.25;.33;.45;.49;1" dur="13s" repeatCount="indefinite"/>
      </text>
