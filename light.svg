          <rect width="52" height="28" rx="14" fill="#FFFFFF" stroke="#06B6D4" stroke-opacity=".34"/><text x="16" y="18" fill="#0F766E">Vue</text></g>
        <g transform="translate(636 448)" opacity=".35"><animate attributeName="opacity" values=".35;1" begin="3.08s" dur=".5s" fill="freeze"/>
          <rect width="92" height="28" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-opacity=".28"/><text x="14" y="18" fill="#1D4ED8">TypeScript</text></g>
        <g transform="translate(738 448)" opacity=".35"><animate attributeName="opacity" values=".35;1" begin="3.16s" dur=".5s" fill="freeze"/>
          <rect width="54" height="28" rx="14" fill="#FFFFFF" stroke="#06B6D4" stroke-opacity=".34"/><text x="16" y="18" fill="#0369A1">Vite</text></g>
        <g transform="translate(802 448)" opacity=".35"><animate attributeName="opacity" values=".35;1" begin="3.24s" dur=".5s" fill="freeze"/>
          <rect width="62" height="28" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-opacity=".34"/><text x="14" y="18" fill="#047857">Pinia</text></g>
        <g transform="translate(874 448)" opacity=".35"><animate attributeName="opacity" values=".35;1" begin="3.32s" dur=".5s" fill="freeze"/>
          <rect width="78" height="28" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-opacity=".28"/><text x="14" y="18" fill="#1D4ED8">PrimeVue</text></g>
        <g transform="translate(962 448)" opacity=".35"><animate attributeName="opacity" values=".35;1" begin="3.4s" dur=".5s" fill="freeze"/>
          <rect width="66" height="28" rx="14" fill="#FFFFFF" stroke="#06B6D4" stroke-opacity=".34"/><text x="13" y="18" fill="#0369A1">Docker</text></g>
        <g transform="translate(574 486)" opacity=".35"><animate attributeName="opacity" values=".35;1" begin="3.48s" dur=".5s" fill="freeze"/>
          <rect width="68" height="28" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-opacity=".34"/><text x="14" y="18" fill="#047857">Node.js</text></g>
        <g transform="translate(652 486)" opacity=".35"><animate attributeName="opacity" values=".35;1" begin="3.56s" dur=".5s" fill="freeze"/>
